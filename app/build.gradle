plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.jarvis.cameras'
    compileSdk 34
    defaultConfig {
        applicationId 'com.jarvis.cameras'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1.0-tv'
    }
    buildTypes {
        release {
            // APK enxuto e mais rápido: código reduzido (R8), recursos não usados removidos, assinado com a chave de depuração (instala direto)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
